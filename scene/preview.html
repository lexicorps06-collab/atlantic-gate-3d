<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script src="ag3d.js"></script><script>
var c=document.getElementById('c'); var q=new URLSearchParams(location.search);
c.width=+(q.get('w')||1920); c.height=+(q.get('h')||1080);
try{ window.S=AGScene(c,{preserve:true}); window.ok=true; }catch(e){ window.err=String(e.message||e); }
window.draw=function(t){ var s=performance.now(); S.render(t); S.gl.finish(); return performance.now()-s; };
</script></body></html>
